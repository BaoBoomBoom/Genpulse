<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 360" fill="none">
  <!-- Asclepius: bearded classical bust with diadem -->
  <g fill="#fff" fill-opacity="0.92">
    <!-- shoulders / drape -->
    <path d="M28 340c18-52 48-88 112-88s94 36 112 88c-28-14-58-20-112-20S56 326 28 340Z"/>
    <path d="M70 268c22-18 48-28 70-28s48 10 70 28c-18 8-42 14-70 14s-52-6-70-14Z" fill-opacity="0.55"/>
    <!-- neck -->
    <path d="M118 230h44c4 18 6 34 6 48h-56c0-14 2-30 6-48Z"/>
    <!-- head oval -->
    <ellipse cx="140" cy="148" rx="62" ry="78"/>
    <!-- hair mass -->
    <path d="M78 140c4-54 34-92 62-92s58 38 62 92c-10-28-28-46-62-46s-52 18-62 46Z" fill-opacity="0.75"/>
    <path d="M86 118c10-22 28-38 54-38s44 16 54 38c-12-10-30-16-54-16s-42 6-54 16Z"/>
    <!-- diadem -->
    <path d="M92 96h96c2 8-6 14-18 18H110c-12-4-20-10-18-18Z" fill-opacity="0.45"/>
    <!-- beard -->
    <path d="M100 168c8 46 24 72 40 78 16-6 32-32 40-78-12 18-28 28-40 28s-28-10-40-28Z"/>
    <path d="M112 196c8 22 16 34 28 38 12-4 20-16 28-38-8 10-18 16-28 16s-20-6-28-16Z" fill-opacity="0.7"/>
    <!-- brows / eyes suggestion -->
    <path d="M108 142c10-6 20-8 28-6M144 136c10-2 20 0 28 6" stroke="#000" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M118 154c4 2 8 2 12 0M150 154c4 2 8 2 12 0" stroke="#000" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- nose / mouth soft -->
    <path d="M140 150v22c-4 2-6 6-6 10" stroke="#000" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M130 198c6 6 14 8 20 0" stroke="#000" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <!-- tiny serpent-staff mark on chest -->
  <g stroke="#fff" stroke-opacity="0.55" stroke-width="1.4" fill="none" stroke-linecap="round">
    <line x1="140" y1="278" x2="140" y2="318"/>
    <path d="M140 286c8 6 8 14 0 20s-8 14 0 20"/>
  </g>
</svg>
