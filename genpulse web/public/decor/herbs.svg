<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- medicinal herb cluster: fennel / leaf sprigs -->
  <g stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- center stem -->
    <path d="M100 220 V40" stroke-width="1.5"/>
    <!-- left sprig -->
    <path d="M100 180 C70 170, 48 150, 40 120" stroke-width="1.3"/>
    <path d="M100 140 C72 132, 52 112, 44 88" stroke-width="1.2"/>
    <path d="M100 100 C78 92, 62 74, 56 54" stroke-width="1.2"/>
    <!-- right sprig -->
    <path d="M100 190 C130 178, 152 156, 160 124" stroke-width="1.3"/>
    <path d="M100 150 C128 140, 148 118, 156 92" stroke-width="1.2"/>
    <path d="M100 110 C122 100, 138 80, 144 58" stroke-width="1.2"/>
    <!-- leaflets -->
    <g fill="#fff" stroke="none">
      <ellipse cx="58" cy="156" rx="10" ry="5" transform="rotate(-35 58 156)" fill-opacity="0.8"/>
      <ellipse cx="48" cy="138" rx="9" ry="4.5" transform="rotate(-42 48 138)" fill-opacity="0.7"/>
      <ellipse cx="42" cy="120" rx="8" ry="4" transform="rotate(-50 42 120)" fill-opacity="0.65"/>
      <ellipse cx="62" cy="118" rx="9" ry="4.5" transform="rotate(-38 62 118)" fill-opacity="0.75"/>
      <ellipse cx="54" cy="100" rx="8" ry="4" transform="rotate(-45 54 100)" fill-opacity="0.7"/>
      <ellipse cx="70" cy="84" rx="8" ry="4" transform="rotate(-32 70 84)" fill-opacity="0.8"/>
      <ellipse cx="60" cy="68" rx="7" ry="3.5" transform="rotate(-40 60 68)" fill-opacity="0.65"/>

      <ellipse cx="142" cy="164" rx="10" ry="5" transform="rotate(32 142 164)" fill-opacity="0.8"/>
      <ellipse cx="152" cy="146" rx="9" ry="4.5" transform="rotate(40 152 146)" fill-opacity="0.7"/>
      <ellipse cx="158" cy="128" rx="8" ry="4" transform="rotate(48 158 128)" fill-opacity="0.65"/>
      <ellipse cx="138" cy="126" rx="9" ry="4.5" transform="rotate(36 138 126)" fill-opacity="0.75"/>
      <ellipse cx="146" cy="108" rx="8" ry="4" transform="rotate(42 146 108)" fill-opacity="0.7"/>
      <ellipse cx="130" cy="90" rx="8" ry="4" transform="rotate(30 130 90)" fill-opacity="0.8"/>
      <ellipse cx="140" cy="74" rx="7" ry="3.5" transform="rotate(38 140 74)" fill-opacity="0.65"/>

      <!-- top buds -->
      <ellipse cx="100" cy="36" rx="5" ry="8" fill-opacity="0.85"/>
      <ellipse cx="88" cy="48" rx="4" ry="7" transform="rotate(-18 88 48)" fill-opacity="0.7"/>
      <ellipse cx="112" cy="48" rx="4" ry="7" transform="rotate(18 112 48)" fill-opacity="0.7"/>
    </g>
  </g>
</svg>
