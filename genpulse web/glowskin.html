<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="shortcut icon" href="assets/favicon.ico">
    <title>GlowSkin AI Skin Analyzer</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/sf-pro-display');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #000000;
            --white: #ffffff;
            --gray-100: #f5f5f7;
            --gray-200: #e8e8ed;
            --gray-400: #86868b;
            --gray-500: #6e6e73;
            --gray-600: #424245;
            --blue: #2997ff;
            --blue-hover: #0077ed;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Subtle gradient backdrop */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150%;
            height: 100%;
            background: radial-gradient(ellipse 50% 80% at 50% 20%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Content */
        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 980px;
            margin-bottom: 60px;
        }

        .hero-eyebrow {
            font-size: 21px;
            font-weight: 400;
            color: var(--gray-400);
            margin-bottom: 8px;
            letter-spacing: -0.01em;
            animation: fadeInUp 1s ease-out;
        }

        .hero-title {
            font-size: clamp(48px, 10vw, 80px);
            font-weight: 600;
            letter-spacing: -0.025em;
            line-height: 1.05;
            margin-bottom: 16px;
            animation: fadeInUp 1s ease-out 0.1s both;
        }

        .hero-subtitle {
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 400;
            color: var(--gray-400);
            letter-spacing: -0.01em;
            margin-bottom: 24px;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .hero-cta {
            display: flex;
            justify-content: center;
            gap: 24px;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        .cta-link {
            font-size: 21px;
            font-weight: 400;
            color: var(--blue);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .cta-link:hover {
            color: var(--blue-hover);
            text-decoration: underline;
        }

        .cta-link svg {
            width: 14px;
            height: 14px;
            transition: transform 0.2s;
        }

        .cta-link:hover svg {
            transform: translateX(3px);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Product Image Container */
        .product-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 1.2s ease-out 0.4s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Device - pebble/egg shape */
        .device {
            position: relative;
            width: 280px;
            height: 400px;
            margin: 0 auto;
            filter: drop-shadow(0 60px 120px rgba(0, 0, 0, 0.6));
        }

        /* Main body - organic pebble shape */
        .device-body {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 320px;
            background: linear-gradient(
                135deg,
                #ffffff 0%,
                #fafafa 15%,
                #f5f5f5 30%,
                #f0f0f0 50%,
                #e8e8e8 70%,
                #e0e0e0 85%,
                #d8d8d8 100%
            );
            border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
            box-shadow:
                inset -15px -10px 40px rgba(255, 255, 255, 0.8),
                inset 10px 10px 30px rgba(0, 0, 0, 0.03),
                inset 5px 0 20px rgba(255, 255, 255, 0.6),
                0 20px 60px rgba(0, 0, 0, 0.2);
        }

        /* Subtle surface highlight */
        .device-body::before {
            content: '';
            position: absolute;
            top: 8%;
            left: 15%;
            width: 40%;
            height: 25%;
            background: radial-gradient(
                ellipse at center,
                rgba(255, 255, 255, 0.7) 0%,
                transparent 70%
            );
            border-radius: 50%;
            filter: blur(8px);
        }

        /* Secondary highlight */
        .device-body::after {
            content: '';
            position: absolute;
            bottom: 20%;
            right: 10%;
            width: 30%;
            height: 20%;
            background: radial-gradient(
                ellipse at center,
                rgba(255, 245, 230, 0.4) 0%,
                transparent 70%
            );
            border-radius: 50%;
            filter: blur(10px);
        }

        /* Camera/sensor head */
        .device-head {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 55px;
            background: linear-gradient(
                180deg,
                #e8e8e8 0%,
                #f0f0f0 30%,
                #f8f8f8 60%,
                #ffffff 100%
            );
            border-radius: 35px 35px 25px 25px;
            box-shadow:
                inset 0 -5px 15px rgba(0, 0, 0, 0.05),
                inset 0 3px 8px rgba(255, 255, 255, 0.8),
                0 5px 20px rgba(0, 0, 0, 0.15);
        }

        /* Lens */
        .device-lens {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            background: radial-gradient(
                circle at 35% 35%,
                #3a3a45 0%,
                #2a2a32 40%,
                #1a1a20 70%,
                #0a0a0f 100%
            );
            border-radius: 50%;
            border: 3px solid #b8b8bd;
            box-shadow:
                inset 0 3px 10px rgba(0, 0, 0, 0.5),
                0 2px 4px rgba(255, 255, 255, 0.3);
        }

        .device-lens::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, transparent 70%);
            border-radius: 50%;
        }

        /* Main button - pill shaped */
        .device-button {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 70px;
            background: linear-gradient(
                180deg,
                #f5f5f5 0%,
                #ebebeb 30%,
                #e0e0e0 70%,
                #d5d5d5 100%
            );
            border-radius: 20px;
            box-shadow:
                inset 0 2px 4px rgba(255, 255, 255, 0.8),
                inset 0 -2px 6px rgba(0, 0, 0, 0.08),
                0 4px 12px rgba(0, 0, 0, 0.1);
        }

        .device-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 60px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 15px;
        }

        /* LED indicators */
        .device-leds {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }

        .device-led {
            width: 5px;
            height: 5px;
            background: radial-gradient(circle, #404045 0%, #2a2a30 100%);
            border-radius: 50%;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        /* Warm glow spot (bottom of device) */
        .device-glow {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: radial-gradient(
                circle,
                rgba(255, 235, 200, 0.25) 0%,
                rgba(255, 220, 180, 0.1) 50%,
                transparent 70%
            );
            border-radius: 50%;
            filter: blur(5px);
        }

        /* Feature labels - Apple style */
        .features {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .feature {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            animation: featureFadeIn 0.8s ease-out forwards;
        }

        .feature-left {
            flex-direction: row-reverse;
            text-align: right;
        }

        .feature-line {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.4));
        }

        .feature-left .feature-line {
            background: linear-gradient(270deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.4));
        }

        .feature-dot {
            width: 6px;
            height: 6px;
            background: var(--white);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .feature-text {
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-100);
            white-space: nowrap;
        }

        .feature-subtext {
            font-size: 12px;
            font-weight: 400;
            color: var(--gray-500);
            margin-top: 2px;
        }

        /* Feature positions */
        .feature-1 {
            top: 8%;
            right: calc(50% + 100px);
            animation-delay: 0.8s;
        }

        .feature-2 {
            top: 35%;
            left: calc(50% + 100px);
            animation-delay: 1s;
        }

        .feature-3 {
            top: 55%;
            right: calc(50% + 100px);
            animation-delay: 1.2s;
        }

        .feature-4 {
            top: 75%;
            left: calc(50% + 100px);
            animation-delay: 1.4s;
        }

        @keyframes featureFadeIn {
            from {
                opacity: 0;
                transform: translateX(10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .feature-left {
            animation-name: featureFadeInLeft;
        }

        @keyframes featureFadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Scroll indicator */
        .scroll-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--gray-500);
            font-size: 12px;
            animation: bounce 2s ease-in-out infinite;
        }

        .scroll-hint svg {
            width: 20px;
            height: 20px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(8px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero {
                padding: 60px 20px;
            }

            .hero-eyebrow {
                font-size: 17px;
            }

            .hero-subtitle {
                font-size: 21px;
            }

            .hero-cta {
                flex-direction: column;
                gap: 16px;
            }

            .cta-link {
                font-size: 17px;
            }

            .device {
                transform: scale(0.85);
            }

            .features {
                display: none;
            }

            .scroll-hint {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .device {
                transform: scale(0.7);
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <p class="hero-eyebrow">Introducing</p>
            <h1 class="hero-title">GlowSkin</h1>
            <p class="hero-subtitle">AI skin analysis. Know your skin.</p>
            <div class="hero-cta">
                <a href="/" class="cta-link">
                    Learn more
                    <svg viewBox="0 0 14 14" fill="none">
                        <path d="M1 7h12M8 2l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
                <a href="#" class="cta-link">
                    Pre-order
                    <svg viewBox="0 0 14 14" fill="none">
                        <path d="M1 7h12M8 2l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            </div>
        </div>

        <div class="product-container">
            <!-- Device -->
            <div class="device">
                <div class="device-head">
                    <div class="device-lens"></div>
                </div>
                <div class="device-body">
                    <div class="device-button"></div>
                    <div class="device-leds">
                        <div class="device-led"></div>
                        <div class="device-led"></div>
                        <div class="device-led"></div>
                    </div>
                    <div class="device-glow"></div>
                </div>
            </div>

            <!-- Feature callouts -->
            <div class="features">
                <div class="feature feature-1 feature-left">
                    <div class="feature-content">
                        <div class="feature-text">10MP Skin Sensor</div>
                        <div class="feature-subtext">Pore-level detail</div>
                    </div>
                    <div class="feature-line"></div>
                    <div class="feature-dot"></div>
                </div>

                <div class="feature feature-2">
                    <div class="feature-dot"></div>
                    <div class="feature-line"></div>
                    <div class="feature-content">
                        <div class="feature-text">One-Touch Scan</div>
                        <div class="feature-subtext">Press and hold to capture</div>
                    </div>
                </div>

                <div class="feature feature-3 feature-left">
                    <div class="feature-content">
                        <div class="feature-text">Ergonomic Design</div>
                        <div class="feature-subtext">Fits naturally in hand</div>
                    </div>
                    <div class="feature-line"></div>
                    <div class="feature-dot"></div>
                </div>

                <div class="feature feature-4">
                    <div class="feature-dot"></div>
                    <div class="feature-line"></div>
                    <div class="feature-content">
                        <div class="feature-text">All-Day Battery</div>
                        <div class="feature-subtext">8+ hours continuous use</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="scroll-hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 5v14M5 12l7 7 7-7"/>
            </svg>
        </div>
    </section>
</body>
</html>
